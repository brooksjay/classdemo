    <style>
      a,
      button,
      input,
      select,
      h1,
      h2,
      h3,
      h4,
      h5,
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        border: none;
        text-decoration: none;
        background: none;

        -webkit-font-smoothing: antialiased;
      }

      menu,
      ol,
      ul {
        list-style-type: none;
        margin: 0;
        padding: 0;
      }

      /* Brown background */
      .landing-page {
        background-color: #b08364;
        min-height: 100vh;
        width: 100%;
        color: white;
      }

        text-align: center;
        padding-top: 270px;
      }

      /* Main heading */
      .let-s-create-a-website-design {
        position: static !important;
        font-size: 48px;
        font-weight: 700;
        line-height: 1.2;
        color: white;

      /* Description */
      .today-let-s-create-a-sample-website-design-in-figma-and-export-its-corresponding-html-and-css-code {
        position: static !important;
        margin: 25px auto 0;
        max-width: 700px;
        font-size: 32px;
        line-height: 1.2;
        color: white;
      }

      /* Get Started button */
      .button {
        position: static !important;
        width: fit-content;
        margin: 100px auto 0;
        padding: 12px 24px;
        background-color: #9cff00;
        border-radius: 10px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
      }

      .get-started {
        position: static !important;
        font-size: 24px;
        color: black;
      }
    </style>

    <title>Document</title>
